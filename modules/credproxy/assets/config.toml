# Rendered at install time. No credential value is stored in this file.
listen_unix = "@BROKER_SOCKET@"
log_level = "info"

[[route]]
path = "/v1/sync/remote"
# credproxy strips the matched route prefix before ReverseProxy.SetURL, so the
# product-owned endpoint must be present on the fixed upstream URL.
upstream = "http://127.0.0.1:8480/v1/sync/remote"
credential_command = ["@HOOK_PATH@"]
hook_timeout_sec = 30
strip_inbound_auth = true

[[route]]
path = "/thirdverse-amsterdam-jenkins"
upstream = "https://jenkins.ams.3vs.dev/mcp-server/mcp"
credential_command = ["@HOOK_PATH@"]
refresh_on_status = [401]
hook_timeout_sec = 30
strip_inbound_auth = true

# XAI was retired only after installed consumer inventory was determinate.
# Anthropic remains disabled because it has no protocol-injection integration.
