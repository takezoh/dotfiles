# Rendered at install time. No credential value is stored in this file.
listen_unix = "@BROKER_SOCKET@"
log_level = "info"

[[route]]
path = "/v1/sync/remote"
upstream = "http://127.0.0.1:8480"
credential_command = ["@HOOK_PATH@"]
hook_timeout_sec = 10
strip_inbound_auth = true

# XAI was retired only after installed consumer inventory was determinate.
# Anthropic remains disabled because it has no protocol-injection integration.
